[build]
  publish = "netlify/brand"
  command = "node --version && npm --version && npm run build:ts && if [ -n \"$CONTENTFUL_API_TOKEN\" ] && [ -n \"$SPACE_ID\" ]; then npm run build:contentful; else echo 'Skipping Contentful rebuild (CONTENTFUL_API_TOKEN/SPACE_ID not set).'; fi"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[[redirects]]
  from = "/example/static/mcp"
  to = "/.netlify/functions/static-mcp"
  status = 200

[[redirects]]
  from = "/example/contentful/mcp"
  to = "/.netlify/functions/contentful-mcp"
  status = 200
