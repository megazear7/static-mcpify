[build]
  publish = "public"
  command = "if [ -n \"$CONTENTFUL_API_TOKEN\" ] && [ -n \"$SPACE_ID\" ]; then npm run build:contentful; else npm run build; fi"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
